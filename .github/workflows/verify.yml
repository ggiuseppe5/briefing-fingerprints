name: Verify fingerprints are append-only
on:
  push:
  pull_request:
  # Pushes made by the sync workflow do not start other workflows, so also run after each sync.
  workflow_run:
    workflows: ['Append new fingerprints']
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every line, and that earlier lines are unchanged
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE:fingerprints.jsonl" 2>/dev/null; then
            git show "$BEFORE:fingerprints.jsonl" > "$RUNNER_TEMP/previous.jsonl"
            python3 scripts/fingerprints.py check --previous "$RUNNER_TEMP/previous.jsonl"
          else
            python3 scripts/fingerprints.py check
          fi
